name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.4.2)"
        required: true
        type: string
      track:
        description: "Play Store track to deploy to, or 'skip' to build only"
        required: true
        type: choice
        default: skip
        options:
          - skip
          - internal
          - beta
          - production

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Resolve track
        id: track
        run: |
          if [ -n "${{ inputs.track }}" ]; then
            track="${{ inputs.track }}"
          else
            # Push-triggered runs have no workflow_dispatch input; read the track
            # embedded by version-bump.yml's annotated tag (release-track:<track>).
            # Absent or unrecognized falls back to 'skip' (build-only) as the safe default.
            tag_message=$(git for-each-ref "refs/tags/${{ steps.resolve.outputs.tag }}" --format='%(contents)')
            track=$(echo "$tag_message" | grep -oE 'release-track:[a-z]+' | cut -d: -f2)
          fi
          echo "track=${track:-skip}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.resolve.outputs.tag }}

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build release AAB
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleProductionRelease

      - name: Locate and rename build artifact
        id: artifacts
        run: |
          project_name=$(grep -oE 'rootProject\.name\s*=\s*"[^"]+"' settings.gradle.kts | sed -E 's/.*"([^"]+)"/\1/')
          version_code=$(awk '/create\("production"\)/{f=1} f && /versionCode/{match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH); exit}' app/build.gradle.kts)
          artifact_name="${project_name}-productionRelease-code${version_code}-v${{ steps.version.outputs.version }}"

          src=$(find app/build/outputs/bundle/productionRelease -name "*.aab" | head -n 1)
          dest="$(dirname "$src")/${artifact_name}.aab"
          mv "$src" "$dest"

          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "aab=$dest" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Zip merged native libs
        id: native_libs
        run: |
          native_libs_dir="app/build/intermediates/merged_native_libs/productionRelease/mergeProductionReleaseNativeLibs/out"
          zip_path="$(pwd)/${{ steps.artifacts.outputs.name }}-native-libs.zip"
          if [ -d "$native_libs_dir" ] && [ -n "$(find "$native_libs_dir" -mindepth 1 -print -quit)" ]; then
            (cd "$native_libs_dir" && zip -r "$zip_path" .)
            echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No merged native libs found at $native_libs_dir; skipping native-libs zip."
          fi

      - name: Generate Play Store changelog
        if: steps.track.outputs.track != 'skip'
        run: |
          changelog_dir="fastlane/metadata/android/en-US/changelogs"
          changelog_file="$changelog_dir/${{ steps.artifacts.outputs.version_code }}.txt"
          mkdir -p "$changelog_dir"

          if [ -f "$changelog_file" ]; then
            echo "Custom changelog already committed at $changelog_file, leaving it as-is."
          else
            previous_tag=$(git describe --tags --abbrev=0 "${{ steps.resolve.outputs.tag }}^" 2>/dev/null || echo "")
            if [ -n "$previous_tag" ]; then
              git log "${previous_tag}..${{ steps.resolve.outputs.tag }}" \
                --pretty=format:"- %s" \
                --invert-grep --grep="^chore: bump version" \
                > "$changelog_file"
            else
              echo "- Initial release" > "$changelog_file"
            fi
            # Play Store limits release notes to 500 characters per locale
            head -c 500 "$changelog_file" > "${changelog_file}.tmp" && mv "${changelog_file}.tmp" "$changelog_file"
          fi
          cat "$changelog_file"

      - name: Set up Ruby
        if: steps.track.outputs.track != 'skip'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Deploy to Play Store
        if: steps.track.outputs.track != 'skip'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > fastlane/play-service-account.json
          bundle exec fastlane deploy track:${{ steps.track.outputs.track }}

      # Kept as a private Actions artifact (not a public release download) so the
      # bundle used for the Play Store upload is traceable to this tag/run.
      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.name }}
          path: |
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.native_libs.outputs.zip }}
          if-no-files-found: warn
          retention-days: 14

      # No files attached: Play Store is the only distribution channel for now.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
