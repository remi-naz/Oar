name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: "Which part of the semver to bump. 'build' keeps versionName's core and only raises versionCode (next beta, or finalizing a beta)."
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - build
      prerelease:
        description: "Prerelease prefix, e.g. beta (numbered automatically: 1.8.0-beta.1, -beta.2, ...). Required when running from a branch other than main; leave empty for a stable release."
        required: false
        type: string
      track:
        description: "Play Store track for the resulting release, or 'skip' to build only"
        required: false
        type: choice
        default: skip
        options:
          - skip
          - internal
          - beta
          - production

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Mint token as version-bump-bot
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PR_COMBI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_COMBI_BOT_PRIVATE_KEY }}

      # The branch chosen under "Use workflow from" is the one bumped and tagged.
      # Guards so a feature-branch build can never look like (or ship as) a stable release.
      - name: Validate inputs
        env:
          REF_TYPE: ${{ github.ref_type }}
          BASE_BRANCH: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          TRACK: ${{ inputs.track }}
        run: |
          if [ "$REF_TYPE" != "branch" ]; then
            echo "::error::Run this workflow from a branch (\"Use workflow from\"), not a tag."
            exit 1
          fi
          if [ "$BASE_BRANCH" != "main" ] && [ -z "$PRERELEASE" ]; then
            echo "::error::A prerelease prefix (e.g. beta) is required when running from a branch other than main."
            exit 1
          fi
          if { [ "$BASE_BRANCH" != "main" ] || [ -n "$PRERELEASE" ]; } && [ "$TRACK" = "production" ]; then
            echo "::error::Prerelease or non-main builds cannot be deployed to the production track."
            exit 1
          fi
          if ! [[ "$PRERELEASE" =~ ^[A-Za-z]*$ ]]; then
            echo "::error::Prerelease prefix may only contain letters (e.g. beta)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Bump version
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump-type }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: python3 .github/scripts/bump_version.py "$BUMP_TYPE" $PRERELEASE

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit on bump branch
        id: branch
        run: |
          branch="chore/bump-v${{ steps.bump.outputs.new_version }}"
          git checkout -b "$branch"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push origin "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      # main requires PRs + signed commits (other base branches use the same flow). A squash-merge performed via the API
      # is created and GPG-signed by GitHub itself, so this satisfies the signed
      # commit rule without needing a bot signing key or a branch-protection bypass.
      - name: Open and merge PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          pr_url=$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "${{ steps.branch.outputs.name }}" \
            --title "chore: bump version to ${{ steps.bump.outputs.new_version }}" \
            --body "Automated version bump (${{ inputs.bump-type }}) to ${{ steps.bump.outputs.new_version }} (code ${{ steps.bump.outputs.new_code }}). ${{ (inputs.track == 'skip' || inputs.track == '') && 'Build only, will not deploy to Play Store.' || format('Will deploy to the {0} track.', inputs.track) }}")
          gh pr merge "$pr_url" --squash --delete-branch

      - name: Tag merged commit
        env:
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          # new_version already carries any prerelease suffix (e.g. 1.8.0-beta.2)
          tag="v${{ steps.bump.outputs.new_version }}"
          git fetch origin "$BASE_BRANCH"
          git checkout -B "$BASE_BRANCH" "origin/$BASE_BRANCH"
          git tag -a "$tag" -m "release-track:${{ inputs.track || 'skip' }}"
          git push origin "$tag"
