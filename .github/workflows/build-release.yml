name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v1.4.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.resolve.outputs.tag }}

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build release AAB
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew bundleProductionRelease

      - name: Locate and rename build artifact
        id: artifacts
        run: |
          project_name=$(grep -oE 'rootProject\.name\s*=\s*"[^"]+"' settings.gradle.kts | sed -E 's/.*"([^"]+)"/\1/')
          version_code=$(awk '/create\("production"\)/{f=1} f && /versionCode/{match($0, /[0-9]+/); print substr($0, RSTART, RLENGTH); exit}' app/build.gradle.kts)
          artifact_name="${project_name}-productionRelease-code${version_code}-v${{ steps.version.outputs.version }}"

          src=$(find app/build/outputs/bundle/productionRelease -name "*.aab" | head -n 1)
          dest="$(dirname "$src")/${artifact_name}.aab"
          mv "$src" "$dest"

          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "aab=$dest" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Zip merged native libs
        id: native_libs
        run: |
          native_libs_dir="app/build/intermediates/merged_native_libs/productionRelease/mergeProductionReleaseNativeLibs/out"
          zip_path="$(pwd)/${{ steps.artifacts.outputs.name }}-native-libs.zip"
          if [ -d "$native_libs_dir" ] && [ -n "$(find "$native_libs_dir" -mindepth 1 -print -quit)" ]; then
            (cd "$native_libs_dir" && zip -r "$zip_path" .)
            echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No merged native libs found at $native_libs_dir; skipping native-libs zip."
          fi

      # Kept as a private Actions artifact (not a public release download). deploy.yml
      # looks this up by name (suffix -v<version>) to upload the exact bundle built here.
      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifacts.outputs.name }}
          path: |
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.native_libs.outputs.zip }}
          if-no-files-found: warn
          retention-days: 30

      # Must use the bot token, not GITHUB_TOKEN: events created by GITHUB_TOKEN never
      # trigger other workflows, so deploy.yml (on: release) would not fire.
      - name: Mint token as release bot
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.V_BUMP_BOT_CLIENT_ID }}
          private-key: ${{ secrets.V_BUMP_BOT_PRIVATE_KEY }}

      # No files attached: Play Store is the only distribution channel for now.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: "v${{ steps.version.outputs.version }}"
          generate_release_notes: true
